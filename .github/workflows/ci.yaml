name: Publish App (Android)

on:
  push:
    branches:
      - main

env:
  BUILD_TOOLS_VERSION: 36.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 27
          distribution: temurin
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0 platforms;android-37.1 platform-tools'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-overwrite-existing: 'true'
          cache-cleanup: 'on-success'
      - run: ./gradlew :app:assembleRelease
      - uses: r0adkll/sign-android-release@v1
        id: sign_apk
        name: Sign APK
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release-unsigned-signed.apk
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: | 
            fdroid
            requirements.txt
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        name: Download artifact
        with:
          name: apk
          path: apk
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.run_number }}
          files: app.apk
      - name: Setup F-Droid signing
        working-directory: fdroid
        env:
          FDROID_KEYSTORE: ${{ secrets.KEYSTORE }}
        run: echo "$FDROID_KEYSTORE" | base64 --decode > keystore.p12
      - uses: actions/checkout@v7
        with:
          ref: 'fdroid-repo'
          path: 'fdroid-workspace'
      - name: Copy F-Droid config to workspace
        run: cp fdroid/* fdroid-workspace -r
      - name: Copy Release APK into repo
        run: cp apk/app-release-unsigned-signed.apk fdroid-workspace/repo
      - name: Update F-Droid repo
        working-directory: fdroid-workspace
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: fdroid update --rename
      - name: Commit changes
        working-directory: fdroid-workspace
        run: |
          git add .
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -a -m "Update F-Droid repo"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fdroid-repo
          directory: fdroid-workspace
      - name: Trigger deploy CI
        run: gh workflow run publish.yml --ref fdroid-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

